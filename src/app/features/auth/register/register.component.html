<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Join ShopNow today</p>
    </div>

    <div class="error-alert" *ngIf="error$ | async as error">
      ⚠️ {{ error }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" formControlName="firstName" placeholder="John" class="form-input"
            [class.invalid]="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched" />
          <span class="error-text" *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
            First name required (min 2 chars)
          </span>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" formControlName="lastName" placeholder="Doe" class="form-input"
            [class.invalid]="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched" />
          <span class="error-text" *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
            Last name required (min 2 chars)
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="you@example.com" class="form-input"
          [class.invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" />
        <span class="error-text" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Valid email required
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Min 6 characters" class="form-input"
            [class.invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" />
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Re-enter password" class="form-input"
          [class.invalid]="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" />
        <span class="error-text" *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched">
          Passwords do not match
        </span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid || (loading$ | async)">
        <span *ngIf="!(loading$ | async)">Create Account</span>
        <span *ngIf="loading$ | async">Creating account...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/auth/login">Sign in</a></p>
    </div>
  </div>
</div>
